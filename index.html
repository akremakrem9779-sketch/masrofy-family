<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#111111">
  <meta name="description"
        content="مصروفي العائلي PRO - إدارة ومتابعة مصروفات الأسرة">

  <link rel="manifest" href="manifest.webmanifest">

  <title>مصروفي العائلي PRO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111;
      font-family:
        Arial,
        Tahoma,
        sans-serif;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    .app {
      width: 100%;
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* HEADER */

    header {
      background: #111;
      color: white;
      padding: 24px 18px 28px;
      border-radius: 0 0 28px 28px;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
    }

    .subtitle {
      color: #aaa;
      font-size: 13px;
      margin-top: 5px;
    }

    .balance-card {
      margin-top: 20px;
      padding: 18px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 18px;
    }

    .balance-title {
      color: #aaa;
      font-size: 13px;
    }

    .balance {
      font-size: 34px;
      font-weight: 800;
      margin: 8px 0;
    }

    .online {
      color: #42d17d;
      font-size: 12px;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .stat {
      background: white;
      color: #111;
      border-radius: 15px;
      padding: 12px;
    }

    .stat-title {
      color: #777;
      font-size: 11px;
    }

    .stat-value {
      display: block;
      margin-top: 5px;
      font-size: 16px;
      font-weight: 800;
    }

    /* MAIN */

    main {
      padding: 16px;
    }

    .tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      margin-bottom: 15px;
    }

    .tab {
      border: 0;
      background: white;
      border-radius: 12px;
      padding: 10px 14px;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab.active {
      background: #111;
      color: white;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    h2 {
      font-size: 19px;
      margin: 8px 0 14px;
    }

    /* CARDS */

    .card {
      background: white;
      border-radius: 17px;
      padding: 14px;
      margin: 10px 0;
    }

    .expense-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
    }

    .grow {
      flex: 1;
    }

    .expense-title {
      font-weight: 700;
    }

    .expense-info {
      color: #888;
      font-size: 12px;
      margin-top: 4px;
    }

    .expense-amount {
      font-weight: 800;
    }

    /* INPUT */

    input,
    select {
      width: 100%;
      border: 1px solid #ddd;
      background: white;
      padding: 13px;
      border-radius: 12px;
      margin: 5px 0 10px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #111;
    }

    /* CATEGORY */

    .category-card {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .category-card .grow {
      min-width: 0;
    }

    .category-progress {
      height: 6px;
      background: #eee;
      border-radius: 10px;
      margin-top: 7px;
      overflow: hidden;
    }

    .category-progress span {
      display: block;
      height: 100%;
      background: #111;
      border-radius: 10px;
    }

    /* BUTTONS */

    .primary {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 14px;
      background: #111;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    .small-btn {
      border: 0;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }

    /* FAB */

    .fab {
      position: fixed;
      bottom: 75px;
      right: max(
        calc((100% - 600px) / 2 + 18px),
        18px
      );

      width: 60px;
      height: 60px;

      border: 0;
      border-radius: 50%;

      background: #111;
      color: white;

      font-size: 30px;

      box-shadow:
        0 8px 25px rgba(0,0,0,.25);

      cursor: pointer;

      z-index: 20;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;

      transform: translateX(-50%);

      width: min(600px, 100%);

      background: white;

      border-top: 1px solid #ddd;

      display: flex;
      justify-content: space-around;

      padding:
        8px
        8px
        calc(8px + env(safe-area-inset-bottom));

      z-index: 10;
    }

    .bottom-nav button {
      border: 0;
      background: transparent;
      color: #777;
      font-size: 11px;
      cursor: pointer;
    }

    .bottom-nav b {
      display: block;
      font-size: 19px;
      margin-bottom: 2px;
    }

    /* MODAL */

    .modal {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0,0,0,.55);

      align-items: flex-end;

      z-index: 100;
    }

    .modal.show {
      display: flex;
    }

    .sheet {
      width: min(600px, 100%);

      margin: auto;

      background: white;

      border-radius:
        24px
        24px
        0
        0;

      padding: 20px;

      max-height: 90vh;
      overflow-y: auto;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .close {
      border: 0;
      background: #eee;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    /* PEOPLE */

    .person {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .person-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* EMPTY */

    .empty {
      text-align: center;
      color: #888;
      padding: 30px 10px;
    }

    /* LOGIN */

    .login-screen {
      position: fixed;
      inset: 0;

      background: #f3f4f6;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 18px;

      z-index: 200;
    }

    .login-box {
      width: min(420px, 100%);

      background: white;

      border-radius: 24px;

      padding: 25px;

      box-shadow:
        0 15px 40px rgba(0,0,0,.08);
    }

    .login-logo {
      text-align: center;
      font-size: 40px;
      margin-bottom: 8px;
    }

    .login-title {
      text-align: center;
      font-size: 23px;
      font-weight: 800;
    }

    .login-subtitle {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login-screen">

  <div class="login-box">

    <div class="login-logo">💰</div>

    <div class="login-title">
      مصروفي العائلي
    </div>

    <div class="login-subtitle">
      PRO — إدارة مصاريف الأسرة
    </div>

    <input
      id="userName"
      type="text"
      placeholder="اسم المستخدم"
    >

    <input
      id="familyCode"
      type="text"
      placeholder="كود العائلة"
    >

    <button
      class="primary"
      onclick="login()"
    >
      دخول
    </button>

    <p
      style="
        text-align:center;
        color:#888;
        font-size:12px;
        margin
